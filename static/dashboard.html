<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洞察 — 电商用户画像与购买预测系统</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   WARM GALLERY — Design System
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --bg-canvas: #faf8f5;
  --bg-surface: #ffffff;
  --bg-card: #f7f4ef;
  --bg-elevated: #f0ece5;
  --bg-hover: #ede8df;
  --border-subtle: #e8e3da;
  --border-mid: #d9d3c7;
  --border-active: #c4b99e;
  --text-primary: #1a1815;
  --text-secondary: #5c5852;
  --text-muted: #9a958b;
  --text-inverse: #faf8f5;
  --accent-gold: #a8893c;
  --accent-gold-light: #c9a54e;
  --accent-gold-bg: rgba(168,137,60,0.08);
  --accent-gold-border: rgba(168,137,60,0.2);
  --accent-steel: #5a7a8a;
  --accent-steel-bg: rgba(90,122,138,0.06);
  --accent-crimson: #c1665a;
  --accent-crimson-bg: rgba(193,102,90,0.06);
  --accent-sage: #6b8a5e;
  --accent-sage-bg: rgba(107,138,94,0.06);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.05);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.07);
  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 12px;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
    "Source Han Sans SC", sans-serif;
  --font-display: var(--font-ui);
  --font-data: var(--font-ui);
  --transition-fast: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-smooth: 400ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: var(--bg-canvas);
  color: var(--text-primary);
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-ui);
  font-weight: 400;
  line-height: 1.65;
  min-height: 100vh;
  background: linear-gradient(180deg, #fdfcfa 0%, var(--bg-canvas) 15%, var(--bg-canvas) 100%);
  overflow-x: hidden;
}

body::after {
  content: '';
  position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.018;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0; }

.display-title {
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 4vw, 3.4rem);
  font-weight: 600; line-height: 1.08; letter-spacing: 0;
  color: var(--text-primary);
}
.display-title em { font-style: normal; color: var(--accent-gold); }

.section-label {
  font-family: var(--font-data); font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
}

/* ── Layout ───────────────────────────────────────────────────────────── */

.app-container { display: flex; min-height: 100vh; }

.sidebar {
  width: 240px; min-width: 240px; background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle); padding: 2rem 1.3rem;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  z-index: 100; box-shadow: var(--shadow-sm);
}

.sidebar-brand {
  font-family: var(--font-display); font-size: 1.3rem; font-weight: 600;
  color: var(--text-primary); letter-spacing: 0.05em; margin-bottom: 2.2rem;
}
.sidebar-brand span {
  color: var(--text-muted); font-size: 0.62rem; display: block;
  font-family: var(--font-data); font-weight: 400; letter-spacing: 0.12em; margin-top: 0.15rem;
}

.nav-item {
  display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.8rem;
  margin-bottom: 0.12rem; border-radius: var(--radius-sm); cursor: pointer;
  transition: all var(--transition-fast); color: var(--text-secondary);
  font-size: 0.84rem; font-weight: 400; letter-spacing: 0.02em;
  border: 1px solid transparent;
}
.nav-item:hover { color: var(--text-primary); background: var(--bg-elevated); }
.nav-item.active {
  color: var(--accent-gold); background: var(--accent-gold-bg);
  border-color: var(--accent-gold-border); font-weight: 500;
}
.nav-item .nav-icon { width: 16px; text-align: center; font-size: 0.8rem; opacity: 0.6; }
.nav-item.active .nav-icon { opacity: 1; }

.search-box { margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); }
.search-label {
  font-family: var(--font-data); font-size: 0.56rem; letter-spacing: 0.14em;
  color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase;
}
.search-input {
  width: 100%; background: var(--bg-canvas); border: 1px solid var(--border-mid);
  border-radius: var(--radius-sm); padding: 0.45rem 0.65rem; color: var(--text-primary);
  font-family: var(--font-data); font-size: 0.76rem; outline: none; transition: all var(--transition-fast);
}
.search-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px var(--accent-gold-bg); }
.search-input::placeholder { color: var(--text-muted); }

.search-result {
  margin-top: 0.5rem; padding: 0.6rem 0.75rem; background: var(--bg-card);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  font-size: 0.72rem; display: none;
}
.search-result.visible { display: block; animation: fadeUp 0.3s ease; }
.search-result .sr-name { color: var(--accent-gold); font-weight: 600; }
.search-result .sr-stat { color: var(--text-secondary); font-family: var(--font-data); font-size: 0.66rem; margin-top: 0.12rem; }

/* ── Main ─────────────────────────────────────────────────────────────── */

.main-content {
  flex: 1; padding: 2rem 2.5rem; min-width: 0; max-width: 1360px;
  opacity: 1; transition: opacity 0.2s ease;
}

.page-header {
  margin-bottom: 2rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem;
}
.page-header .section-label { margin-bottom: 0.3rem; }

/* ── KPI Cards ────────────────────────────────────────────────────────── */

.kpi-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-bottom: 1.5rem;
}

.kpi-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 1rem 1.2rem;
  position: relative; overflow: hidden; transition: all var(--transition-smooth);
  cursor: default; box-shadow: var(--shadow-sm);
}
.kpi-card::after {
  content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
  background: var(--accent-gold); transform: scaleX(0); transform-origin: left;
  transition: transform var(--transition-smooth);
}
.kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.kpi-card:hover::after { transform: scaleX(1); }

.kpi-label {
  font-family: var(--font-data); font-size: 0.56rem; letter-spacing: 0.13em;
  color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.2rem;
}
.kpi-value {
  font-family: var(--font-display); font-size: 1.7rem; font-weight: 600;
  color: var(--text-primary); letter-spacing: 0; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi-value.accent { color: var(--accent-gold); }
.kpi-subtitle {
  font-family: var(--font-data); font-size: 0.65rem; color: var(--text-secondary); margin-top: 0.3rem;
}

/* ── Chart panels ─────────────────────────────────────────────────────── */

.chart-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;
}

.chart-panel {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 1rem 1.2rem 1.2rem;
  transition: all var(--transition-fast); box-shadow: var(--shadow-sm);
  overflow: visible;
}
.chart-panel:hover { box-shadow: var(--shadow-md); }
.chart-panel.full { grid-column: 1 / -1; }

.chart-title {
  font-family: var(--font-display); font-size: 0.95rem; font-weight: 600;
  color: var(--text-primary); margin-bottom: 0.15rem; letter-spacing: 0.02em;
}
.chart-subtitle {
  font-family: var(--font-data); font-size: 0.6rem; color: var(--text-muted);
  letter-spacing: 0.06em; margin-bottom: 0.5rem;
}

.chart-plot { width: 100%; }
.chart-plot.h300 { min-height: 300px; }
.chart-plot.h340 { min-height: 340px; }
.chart-plot.h400 { min-height: 400px; }
.chart-plot.h460 { min-height: 460px; }
.chart-plot.h500 { min-height: 500px; }

/* ── Propensity workspace ─────────────────────────────────────────────── */

.propensity-brief {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 1rem; margin-bottom: 1rem;
}
.propensity-note {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 1rem 1.2rem; box-shadow: var(--shadow-sm);
}
.propensity-note strong {
  display: block; font-family: var(--font-display); font-size: 1.05rem;
  color: var(--text-primary); margin-bottom: 0.25rem;
}
.propensity-note span {
  color: var(--text-secondary); font-size: 0.78rem; line-height: 1.8;
}
.strategy-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 1rem;
}
.strategy-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 1rem; box-shadow: var(--shadow-sm);
}
.strategy-card.high { border-top: 3px solid var(--accent-crimson); }
.strategy-card.mid { border-top: 3px solid var(--accent-gold); }
.strategy-card.low { border-top: 3px solid var(--accent-steel); }
.strategy-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;
  margin-bottom: 0.6rem;
}
.strategy-name {
  font-family: var(--font-display); font-size: 1rem; font-weight: 600;
  color: var(--text-primary);
}
.strategy-rule {
  font-family: var(--font-data); font-size: 0.58rem; color: var(--text-muted);
  letter-spacing: 0.04em; margin-top: 0.1rem;
}
.strategy-count {
  font-family: var(--font-display); font-size: 1.4rem; color: var(--text-primary); line-height: 1;
  text-align: right; font-variant-numeric: tabular-nums;
}
.strategy-count span {
  display: block; font-family: var(--font-data); font-size: 0.58rem; color: var(--text-muted); margin-top: 0.25rem;
}
.strategy-body {
  display: grid; gap: 0.45rem; font-size: 0.72rem; color: var(--text-secondary); line-height: 1.65;
}
.strategy-body b {
  color: var(--text-primary); font-weight: 500;
}
.strategy-actions {
  display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.2rem;
}
.mini-pill {
  display: inline-flex; align-items: center; border: 1px solid var(--border-subtle);
  border-radius: 999px; padding: 0.14rem 0.5rem; background: var(--bg-card);
  font-family: var(--font-data); font-size: 0.56rem; color: var(--text-secondary);
  letter-spacing: 0.04em; max-width: 100%; white-space: normal; line-height: 1.45;
}
.propensity-layout {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
  gap: 1rem; margin-bottom: 1rem;
}

/* ── Tables ───────────────────────────────────────────────────────────── */

.data-table {
  width: 100%; border-collapse: collapse; font-family: var(--font-data); font-size: 0.7rem;
  font-variant-numeric: tabular-nums;
}
.data-table thead { border-bottom: 2px solid var(--border-mid); }
.data-table th {
  text-align: left; padding: 0.5rem 0.65rem; color: var(--text-muted);
  font-weight: 500; letter-spacing: 0.07em; font-size: 0.6rem; text-transform: uppercase;
}
.data-table td {
  padding: 0.4rem 0.65rem; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary);
}
.data-table tbody tr:hover td { background: var(--bg-elevated); color: var(--text-primary); }

/* ── Tags ─────────────────────────────────────────────────────────────── */

.tag {
  display: inline-block; padding: 0.1rem 0.5rem; border-radius: 2px;
  font-family: var(--font-data); font-size: 0.56rem; letter-spacing: 0.07em; font-weight: 500;
}
.tag-gold { background: var(--accent-gold-bg); color: var(--accent-gold); border: 1px solid var(--accent-gold-border); }
.tag-steel { background: var(--accent-steel-bg); color: var(--accent-steel); border: 1px solid rgba(90,122,138,0.2); }
.tag-crimson { background: var(--accent-crimson-bg); color: var(--accent-crimson); border: 1px solid rgba(193,102,90,0.2); }

/* ── Expand toggle ────────────────────────────────────────────────────── */

.expand-toggle {
  display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.9rem;
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); cursor: pointer; font-family: var(--font-data);
  font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 0.05em;
  transition: all var(--transition-fast); margin-top: 0.8rem; box-shadow: var(--shadow-sm);
}
.expand-toggle:hover { border-color: var(--accent-gold); color: var(--accent-gold); background: var(--accent-gold-bg); }
.expand-content { display: none; margin-top: 0.8rem; }
.expand-content.open { display: block; animation: fadeUp 0.4s ease; }

/* ── Prediction bar ───────────────────────────────────────────────────── */

.prediction-bar { height: 6px; background: var(--border-subtle); border-radius: 3px; overflow: hidden; margin: 0.3rem 0; }
.prediction-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.prediction-fill.high { background: var(--accent-crimson); }
.prediction-fill.mid { background: var(--accent-gold); }
.prediction-fill.low { background: var(--accent-steel); }

/* ── Form ─────────────────────────────────────────────────────────────── */

.btn-primary {
  background: var(--accent-gold); color: white; border: none; border-radius: var(--radius-sm);
  padding: 0.45rem 1.2rem; font-family: var(--font-data); font-size: 0.7rem;
  letter-spacing: 0.07em; cursor: pointer; font-weight: 500; transition: all var(--transition-fast);
}
.btn-primary:hover { background: var(--accent-gold-light); }

.btn-ghost {
  background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold-border);
  border-radius: var(--radius-sm); padding: 0.45rem 1.1rem; font-family: var(--font-data);
  font-size: 0.7rem; letter-spacing: 0.07em; cursor: pointer; transition: all var(--transition-fast);
}
.btn-ghost:hover { background: var(--accent-gold-bg); }

.input-field {
  flex: 1; background: var(--bg-canvas); border: 1px solid var(--border-mid);
  border-radius: var(--radius-sm); padding: 0.45rem 0.65rem; color: var(--text-primary);
  font-family: var(--font-data); font-size: 0.76rem; outline: none; transition: all var(--transition-fast);
}
.input-field:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px var(--accent-gold-bg); }

/* ── Animations ───────────────────────────────────────────────────────── */

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}

.animate-in { animation: fadeUp 0.5s ease both; }
.stagger-1 { animation-delay: 0.03s; }
.stagger-2 { animation-delay: 0.07s; }
.stagger-3 { animation-delay: 0.11s; }
.stagger-4 { animation-delay: 0.15s; }
.stagger-5 { animation-delay: 0.19s; }
.stagger-6 { animation-delay: 0.23s; }

/* ── Responsive ───────────────────────────────────────────────────────── */

@media (max-width: 1200px) {
  .chart-row { grid-template-columns: 1fr; }
  .propensity-brief, .propensity-layout, .strategy-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .sidebar { width: 190px; min-width: 190px; }
  .main-content { padding: 1.5rem; }
}
@media (max-width: 768px) {
  .app-container { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; height: auto; position: relative; padding: 1rem; box-shadow: none; }
  .main-content { padding: 1rem; }
  .kpi-grid { grid-template-columns: 1fr; }
  .display-title { font-size: 1.6rem; }
}
</style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-brand">洞察<span>INSIGHT SYSTEM</span></div>
    <nav id="nav">
      <div class="nav-item active" data-page="overview"><span class="nav-icon">◇</span> 用户画像总览</div>
      <div class="nav-item" data-page="propensity"><span class="nav-icon">◎</span> 购买倾向分析</div>
      <div class="nav-item" data-page="behavior"><span class="nav-icon">◈</span> 行为路径追踪</div>
      <div class="nav-item" data-page="segments"><span class="nav-icon">▣</span> 用户分群与标签</div>
      <div class="nav-item" data-page="products"><span class="nav-icon">◆</span> 热销商品分析</div>
    </nav>
    <div class="search-box">
      <div class="search-label">User Lookup</div>
      <input type="text" class="search-input" id="userSearch" placeholder="输入 User ID…" autocomplete="off">
      <div class="search-result" id="searchResult"></div>
    </div>
  </aside>

  <main class="main-content" id="mainContent"></main>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// CONFIG & HELPERS
// ═══════════════════════════════════════════════════════════════════════════════

const API = 'http://localhost:8000/api';
const GOLD = '#a8893c', GOLD_LIGHT = '#c9a54e', STEEL = '#5a7a8a';
const CRIMSON = '#c1665a', SAGE = '#6b8a5e', BRONZE = '#8b7355';
const CHART_COLORS = [GOLD, STEEL, BRONZE, CRIMSON, SAGE, '#8b7d9e', '#6b95a8', '#c9a54e'];
const PLOTLY_CONFIG = { displayModeBar: false, responsive: true, displaylogo: false };
const FONT_FAMILY = '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
const CLUSTER_COLORS = [STEEL, GOLD, CRIMSON, SAGE, '#8b7d9e', '#6b95a8'];

// Base layout with generous margins so labels never clip
function baseLayout(overrides = {}) {
  // Deep merge so partial margin/xaxis/yaxis overrides don't lose base keys
  const base = {
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: '#5c5852', size: 11, family: FONT_FAMILY },
    margin: { l: 60, r: 30, t: 30, b: 70 },
    xaxis: { gridcolor: '#e8e3da', zeroline: false, linecolor: '#d9d3c7', automargin: true },
    yaxis: { gridcolor: '#e8e3da', zeroline: false, linecolor: '#d9d3c7', automargin: true },
    hovermode: 'x unified',
    legend: { font: { color: '#5c5852' }, orientation: 'h', yanchor: 'top', y: 1.15, xanchor: 'center', x: 0.5 },
    colorway: CHART_COLORS,
  };
  // Deep-merge overrides into base
  const merged = { ...base };
  for (const [key, val] of Object.entries(overrides)) {
    if (val && typeof val === 'object' && !Array.isArray(val) && base[key] && typeof base[key] === 'object' && !Array.isArray(base[key])) {
      merged[key] = { ...base[key], ...val };
    } else {
      merged[key] = val;
    }
  }
  return merged;
}

async function fetchAPI(path) {
  try { const r = await fetch(`${API}${path}`); if (!r.ok) throw new Error(`${r.status}`); return await r.json(); }
  catch (e) { console.error(`API ${path}:`, e); return null; }
}

async function fetchPost(path, body) {
  try { const r = await fetch(`${API}${path}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); if (!r.ok) throw new Error(`${r.status}`); return await r.json(); }
  catch (e) { console.error(`API ${path}:`, e); return null; }
}

function draw(id, data, layoutOverrides = {}) {
  const el = document.getElementById(id);
  if (!el) { console.warn(`draw: element #${id} not found`); return; }
  Plotly.newPlot(id, data, baseLayout(layoutOverrides), PLOTLY_CONFIG);
}

function formatNumber(value, digits = 0) {
  return Number(value || 0).toLocaleString('zh-CN', {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits,
  });
}

function clusterRole(c, clusters) {
  const orderRate = Number(c.order_rate || 0);
  const avgM = Number(c.avg_M || 0);
  const avgF = Number(c.avg_F || 0);
  const avgClicks = Number(c.avg_clicks || 0);
  const maxM = Math.max(...clusters.map(d => Number(d.avg_M || 0)), 1);
  const maxF = Math.max(...clusters.map(d => Number(d.avg_F || 0)), 1);

  if (orderRate >= 0.8 && avgM >= maxM * 0.6) return '高价值用户';
  if (orderRate >= 0.8 && (avgF >= maxF * 0.3 || avgM > 0)) return '活跃购买用户';
  if (orderRate < 0.05 && avgClicks <= 1 && avgM < 1) return '沉睡/无行为用户';
  if (orderRate < 0.05 && avgClicks > 1) return '浏览未转化用户';
  return '低频维护用户';
}

function clusterMeta(clusters) {
  return (clusters || []).map((c, i) => ({
    ...c,
    role: clusterRole(c, clusters || []),
    color: CLUSTER_COLORS[i % CLUSTER_COLORS.length],
  }));
}

    case 'propensity': await renderPropensity(main); break;

    case 'products': await renderProducts(main); break;

}

async function renderPropensity(main) {
  const [dist, segs, topFeats, health, strategy] = await Promise.all([
    fetchAPI('/propensity/distribution'), fetchAPI('/propensity/segments'), fetchAPI('/propensity/top-features'),
    fetchAPI('/health'), fetchAPI('/propensity/strategy'),
  ]);
  let summary = strategy?.summary || {};
  let operations = Array.isArray(strategy?.operations) ? strategy.operations : [];
  const threshold = Number(health?.threshold);
  const thresholdText = Number.isFinite(threshold) ? `阈值 ${threshold.toFixed(3)}` : '验证集阈值';
  const thresholdX = (() => {
    if (!Number.isFinite(threshold) || !Array.isArray(dist) || !dist.length) return 0;
    const idx = dist.findIndex(d => Number.isFinite(Number(d.left)) && Number.isFinite(Number(d.right)) && threshold >= Number(d.left) && threshold <= Number(d.right));
    if (idx >= 0) {
      const left = Number(dist[idx].left), right = Number(dist[idx].right);
      const ratio = right > left ? (threshold - left) / (right - left) : 0;
      return Math.max(-0.5, Math.min(dist.length - 0.5, idx - 0.5 + ratio));
    }
    return Math.max(-0.5, Math.min(dist.length - 0.5, threshold * dist.length - 0.5));
  })();
  const segmentClass = seg => String(seg || '').includes('高') ? 'tag-crimson' : String(seg || '').includes('中') ? 'tag-gold' : 'tag-steel';
  const fillClass = seg => String(seg || '').includes('高') ? 'high' : String(seg || '').includes('中') ? 'mid' : 'low';
  const hasShap = Array.isArray(topFeats) && topFeats.some(d => Number(d.importance) > 0 && !['模型重要性', '待重新训练后生成'].includes(d.direction));
  const hasImportance = Array.isArray(topFeats) && topFeats.some(d => Number(d.importance) > 0);
  const shapSubtitle = hasShap ? 'Top 15 特征 — 基于测试窗口 SHAP 解释' : (hasImportance ? '保留 SHAP 区域；当前缓存未生成 SHAP，显示模型内置重要性回退' : '保留 SHAP 区域；当前缓存未生成解释值');
  const fmtPct = v => Number.isFinite(Number(v)) ? `${(Number(v) * 100).toFixed(1)}%` : 'N/A';
  const fmtRate = v => Number.isFinite(Number(v)) ? `${Number(v).toFixed(1)}%` : 'N/A';
  const fmtNum = v => Number.isFinite(Number(v)) ? Number(v).toLocaleString('zh-CN') : 'N/A';
  const clsBySeg = seg => String(seg || '').includes('高') ? 'high' : String(seg || '').includes('中') ? 'mid' : 'low';
  const totalUsers = Array.isArray(segs) ? segs.reduce((sum, s) => sum + (Number(s.count) || 0), 0) : 0;
  const parseCutoff = text => {
    const nums = String(text || '').match(/\\d+\\.\\d+/g);
    return nums && nums.length ? Number(nums[nums.length - 1]) : null;
  };
  if (!operations.length && Array.isArray(segs) && segs.length) {
    const highSeg = segs.find(s => String(s.segment).includes('高')) || {};
    const midSeg = segs.find(s => String(s.segment).includes('中')) || {};
    const lowSeg = segs.find(s => String(s.segment).includes('低')) || {};
    const fallbackHighCutoff = parseCutoff(highSeg.segment);
    summary = {
      ...summary,
      model_name: summary.model_name || health?.model_name || 'XGBoost',
      threshold: summary.threshold ?? threshold,
      high_cutoff: summary.high_cutoff ?? fallbackHighCutoff,
      predicted_positive_count: summary.predicted_positive_count ?? ((Number(highSeg.count) || 0) + (Number(midSeg.count) || 0)),
      predicted_positive_pct: summary.predicted_positive_pct ?? ((Number(highSeg.pct) || 0) + (Number(midSeg.pct) || 0)),
    };
    operations = [
      { segment: '高倾向', rule: highSeg.segment || 'Top10 优先触达', count: highSeg.count || 0, pct: highSeg.pct || 0, priority: '优先触达', action: '会员权益、限时券、购物车/浏览商品提醒', expected: '高概率优先转化', risk: '控制补贴强度' },
      { segment: '中倾向', rule: midSeg.segment || `${thresholdText} 以上`, count: midSeg.count || 0, pct: midSeg.pct || 0, priority: '培育转化', action: '低成本站内信、相似商品推荐、价格/评价信息补全', expected: '覆盖阈值以上候选人群', risk: '避免直接发高额券' },
      { segment: '低倾向', rule: lowSeg.segment || `${thresholdText} 以下`, count: lowSeg.count || 0, pct: lowSeg.pct || 0, priority: '低频维护', action: '品牌曝光、内容种草、节日大促统一触达', expected: '保留低成本触达', risk: '定期刷新窗口' },
    ];
  }
  const metricCards = [
    { label: '模型', value: summary.model_name || health?.model_name || 'N/A', sub: `${thresholdText} · 已校准概率` },
    { label: '预测触达', value: fmtNum(summary.predicted_positive_count), sub: `${fmtRate(summary.predicted_positive_pct)} 用户进入转化名单` },
    { label: '高倾向边界', value: Number.isFinite(Number(summary.high_cutoff)) ? Number(summary.high_cutoff).toFixed(3) : 'N/A', sub: `Top10 Precision ${fmtPct(summary.top10_precision)}` },
    { label: '测试表现', value: Number.isFinite(Number(summary.auc)) ? summary.auc.toFixed(3) : 'N/A', sub: `AP ${Number.isFinite(Number(summary.ap)) ? summary.ap.toFixed(3) : 'N/A'} · Recall ${fmtPct(summary.recall)}` },
  ];

  main.innerHTML = `
    <div class="page-header">
      <div class="section-label">Module 02</div>
      <h1 class="display-title">购买倾向<em>分析</em></h1>
    </div>

    <div class="propensity-brief animate-in stagger-1">
      <div class="propensity-note">
        <strong>当前运营口径：阈值转化名单 + Top10 优先触达</strong>
        <span>当前使用校准概率进行运营分层：低倾向表示低于模型阈值，中倾向表示阈值以上但未进入 Top10，高倾向表示最值得优先投放的 Top10 人群。</span>
      </div>
      <div class="propensity-note">
        <strong>成本提示</strong>
        <span>当前阈值偏召回，适合大促前圈人；日常优惠券投放应优先使用高倾向或 Top20，而不是把所有阈值以上用户都作为同等预算对象。</span>
      </div>
    </div>

    <div class="kpi-grid animate-in stagger-2">
      ${metricCards.map((m, i) => `
        <div class="kpi-card">
          <div class="kpi-label">${m.label}</div>
          <div class="kpi-value ${i === 1 ? 'accent' : ''}">${m.value}</div>
          <div class="kpi-subtitle">${m.sub}</div>
        </div>`).join('')}
    </div>

    <div class="strategy-grid animate-in stagger-3">
      ${operations.map(op => `
        <div class="strategy-card ${clsBySeg(op.segment)}">
          <div class="strategy-head">
            <div>
              <div class="strategy-name">${op.segment}</div>
              <div class="strategy-rule">${op.rule}</div>
            </div>
            <div class="strategy-count">${fmtNum(op.count)}<span>${fmtRate(op.pct)} 用户</span></div>
          </div>
          <div class="strategy-actions"><span class="mini-pill">${op.priority}</span><span class="mini-pill">${op.expected}</span></div>
          <div class="strategy-body">
            <div><b>动作</b>：${op.action}</div>
            <div><b>风险</b>：${op.risk}</div>
          </div>
        </div>`).join('')}
    </div>

    <div class="propensity-layout">
      <div class="chart-panel animate-in stagger-4"><div class="chart-title">校准概率分布</div><div class="chart-subtitle">动态分箱，虚线为当前业务阈值</div><div class="chart-plot h340" id="chart-dist"></div></div>
      <div class="chart-panel animate-in stagger-4"><div class="chart-title">运营分层规模</div><div class="chart-subtitle">高倾向 / 中倾向 / 低倾向</div><div class="chart-plot h340" id="chart-segs"></div></div>
    </div>

    <div class="chart-panel animate-in stagger-5" style="margin-bottom:1rem;">
      <div class="chart-title">批量预测查询</div>
      <div class="chart-subtitle">返回概率、预测标签和运营分层；不存在的用户会单独列出</div>
      <div style="display:flex;gap:0.6rem;margin-bottom:0.6rem;">
        <input type="text" id="batchInput" class="input-field" placeholder="e.g. 0, 100, 50000, 99999">
        <button id="batchBtn" class="btn-primary">执行预测</button>
      </div>
      <div id="batchResults"></div>
    </div>

    <div class="chart-panel animate-in stagger-6">
      <div class="chart-title">SHAP 解释与关键特征</div>
      <div class="chart-subtitle">${shapSubtitle}</div>
      <div class="chart-plot h500" id="chart-shap"></div>
    </div>`;

  // Distribution — bar chart
  if (dist) draw('chart-dist', [{
    type: 'bar', x: dist.map(d=>d.bin), y: dist.map(d=>d.count),
    marker: { color: dist.map((_,i) => CHART_COLORS[i % CHART_COLORS.length]), line: { width: 0 } },
  }], {
    margin: { b: 80 },
    shapes: [{ type: 'line', x0: thresholdX, x1: thresholdX, y0: 0, y1: 1, yref: 'paper', line: { dash: 'dash', color: GOLD, width: 1.5 } }],
    annotations: [{ text: thresholdText, x: thresholdX, y: 1, yref: 'paper', showarrow: false, font: { color: GOLD, size: 10 }, xanchor: 'right' }],
  });

  // Segments — upright pyramid with labels in the upper-right legend
  if (segs) {
    const pyramidColors = [CRIMSON, GOLD, STEEL];
    const pyramid = segs.map((s, i) => ({ ...s, color: pyramidColors[i] }));
    const visualWidths = [0.36, 0.72, 1.08];
    const topWidths = [0.12, 0.44, 0.80];
    const gap = 0.045;
    const levels = pyramid.map((s, i) => {
      const yTop = pyramid.length - i - gap * i;
      const yBottom = pyramid.length - i - 1 + gap * (pyramid.length - i - 1);
      const topWidth = topWidths[i];
      const bottomWidth = visualWidths[i];
      return {
        type: 'scatter',
        mode: 'lines',
        fill: 'toself',
        name: s.segment,
        x: [-topWidth / 2, topWidth / 2, bottomWidth / 2, -bottomWidth / 2, -topWidth / 2],
        y: [yTop, yTop, yBottom, yBottom, yTop],
        line: { color: '#ffffff', width: 2 },
        fillcolor: s.color,
        hovertemplate: `${s.segment}<br>用户数: ${Number(s.count || 0).toLocaleString('zh-CN')}<br>占比: ${Number(s.pct || 0).toFixed(1)}%<extra></extra>`,
      };
    });
    const annotations = pyramid.map((s, i) => ({
      x: 0,
      y: pyramid.length - i - 0.48,
      text: `<b>${Number(s.pct || 0).toFixed(1)}%</b>`,

      font: { color: '#1a1815', size: 12, family: FONT_FAMILY },
    }));
    draw('chart-segs', levels, {
      height: 340,
      margin: { l: 20, r: 165, t: 18, b: 18 },
    showlegend: true,
    legend: { orientation: 'v', x: 1.02, y: 1, xanchor: 'left', yanchor: 'top', font: { size: 10, color: '#5c5852' } },
    hovermode: 'closest',
    annotations,
    xaxis: { visible: false, range: [-0.62, 0.62], fixedrange: true },
    yaxis: { visible: false, range: [0, pyramid.length + 0.08], fixedrange: true },
    hoverlabel: { bgcolor: '#ffffff', bordercolor: '#d9d3c7', font: { color: '#1a1815', size: 12 } },
    });
  }

  // SHAP — horizontal bar chart with extra left margin for feature names
  if (topFeats) {
    const sorted = [...topFeats].reverse();
    draw('chart-shap', [{
      type: 'bar', orientation: 'h',
      y: sorted.map(d=>d.feature),

  // Batch predict
  document.getElementById('batchBtn')?.addEventListener('click', async () => {
    const input = document.getElementById('batchInput').value.trim();

    const results = Array.isArray(payload) ? payload : (payload?.results || []);
    const missing = Array.isArray(payload?.missing_user_ids) ? payload.missing_user_ids : [];
    const container = document.getElementById('batchResults');
    if (!results || !results.length) {
      container.innerHTML = `<div style="color:var(--accent-crimson);font-family:var(--font-data);font-size:0.7rem;">未找到匹配用户${missing.length ? `：${missing.join(', ')}` : ''}</div>`;

      </tr>`).join('')}</tbody></table>`;
  });
}

    <div class="chart-panel animate-in stagger-3">
      <div class="chart-title">单用户行为路径查询</div>
      <div class="chart-subtitle">查看指定用户的浏览/购买活动统计</div>
      <div style="display:flex;gap:0.6rem;margin-bottom:0.6rem;">
        <input type="text" id="journeyInput" class="input-field" placeholder="输入 User ID">
        <button id="journeyBtn" class="btn-ghost">追踪</button>
      </div>
      <div id="journeyResult"></div>
    </div>`;

  // Time distribution
  if (timeDist) draw('chart-time', [
    { type: 'bar', x: timeDist.map(d=>d.bin), y: timeDist.map(d=>d.count),
      marker: { color: GOLD, line: { width: 0 } }, name: '转化量',
      hovertemplate: '时间区间: %{x}<br>转化量: %{y:,}<extra></extra>' },
    { type: 'scatter', x: timeDist.map(d=>d.bin), y: timeDist.map(d=>d.count),
      mode: 'lines+markers', line: { color: CRIMSON, width: 2 },
      marker: { color: CRIMSON, size: 7, symbol: 'diamond' }, name: '趋势', showlegend: false,
      hovertemplate: '时间区间: %{x}<br>转化量: %{y:,}<extra></extra>' },
  ], {
    margin: { b: 70 },
    showlegend: false,
    hoverlabel: { bgcolor: '#ffffff', bordercolor: '#d9d3c7', font: { color: '#1a1815', size: 12 } },
  });

  // Category funnel — DUAL x-axes because clicks ≈ 70× orders
  if (funnel) {
    const sorted = [...funnel].sort((a,b) => a.click_count - b.click_count);
    const labels = sorted.map(d => d.cid1_name);
    draw('chart-funnel', [
      { type: 'bar', orientation: 'h', y: labels, x: sorted.map(d=>d.click_count),
        name: '点击量', marker: { color: STEEL, line: { width: 0 } },
        xaxis: 'x', hoverinfo: 'name+x+y' },
      { type: 'bar', orientation: 'h', y: labels, x: sorted.map(d=>d.order_count),
        name: '订单量', marker: { color: GOLD, line: { width: 0 } },
        xaxis: 'x2', hoverinfo: 'name+x+y' },
    ], {
      height: 460,
      margin: { l: 120, r: 100, t: 30, b: 30 },
      xaxis: { title: { text: '点击量', font: { color: STEEL, size: 10 } }, gridcolor: '#e8e3da', zeroline: true, domain: [0, 0.47] },
      xaxis2: { title: { text: '订单量', font: { color: GOLD, size: 10 } }, gridcolor: 'rgba(0,0,0,0)', zeroline: true, domain: [0.53, 1], anchor: 'y' },
      yaxis: { automargin: true },
      legend: { y: 1.2 },
    });
  }

  // Journey search
  document.getElementById('journeyBtn')?.addEventListener('click', async () => {
    const uid = document.getElementById('journeyInput').value.trim();
    if (!uid) return;
    const data = await fetchAPI(`/path/user-journey/${uid}`);
    const container = document.getElementById('journeyResult');
    if (!data) { container.innerHTML = '<div style="color:var(--accent-crimson);font-family:var(--font-data);font-size:0.7rem;">用户不存在或数据不可用</div>'; return; }
    const convRate = data.total_clicks > 0 ? (data.total_orders / data.total_clicks * 100).toFixed(1) : '0.0';
    container.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;margin-bottom:0.6rem;">
        <div class="kpi-card"><div class="kpi-label">总浏览</div><div class="kpi-value" style="font-size:1.3rem;">${data.total_clicks.toLocaleString()}</div></div>
        <div class="kpi-card"><div class="kpi-label">总购买</div><div class="kpi-value accent" style="font-size:1.3rem;">${data.total_orders.toLocaleString()}</div></div>
        <div class="kpi-card"><div class="kpi-label">转化率</div><div class="kpi-value" style="font-size:1.3rem;">${convRate}%</div></div>
        <div class="kpi-card"><div class="kpi-label">最近活跃</div><div class="kpi-value" style="font-size:1.3rem;">${data.R_days}天前</div></div>
      </div>
      <div style="color:var(--text-muted);font-family:var(--font-data);font-size:0.65rem;">${data.message || ''}</div>`;
  });
}

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  MODULE 4: 用户分群与标签管理                                                ║
// ╚══════════════════════════════════════════════════════════════════════════════╝

async function renderSegments(main) {
  const [rawClusters, clusterCat] = await Promise.all([
    fetchAPI('/segments/clusters'), fetchAPI('/segments/cluster-category'),
  ]);

  const clusters = clusterMeta(rawClusters);

  main.innerHTML = `
    <div class="page-header">
      <div class="section-label">Module 04</div>
      <h1 class="display-title">用户分群<em>与标签</em></h1>
    </div>
    <div class="kpi-grid">${(clusters||[]).map((c,i)=>`
      <div class="kpi-card animate-in stagger-${i+1}" style="border-left:3px solid ${c.color};">
        <div class="kpi-label">Cluster ${c.cluster} · ${c.role}</div>
        <div class="kpi-value" style="font-size:1.3rem;">${c.user_count.toLocaleString()}</div>
        <div class="kpi-subtitle">R ${c.avg_R.toFixed(0)}天 · F ${c.avg_F.toFixed(1)} · M ¥${formatNumber(c.avg_M, 0)} · 订单率 ${(c.order_rate*100).toFixed(0)}%</div>
      </div>`).join('')}</div>
    <div class="chart-row">
      <div class="chart-panel animate-in stagger-5"><div class="chart-title">分群画像雷达图</div><div class="chart-subtitle">R/F/M/点击/订单率 · 归一化对比</div><div class="chart-plot h400" id="chart-radar"></div></div>
      <div class="chart-panel animate-in stagger-6"><div class="chart-title">群组特征对比表</div><div id="chart-cluster-table" style="overflow-x:auto;"></div></div>
    </div>
    <div class="chart-panel animate-in" style="margin-bottom:1rem;">
      <div class="chart-title">各群组 × 品类偏好热力图</div>
      <div class="chart-subtitle">归一化：数值为该群组内品类订单占比</div>
      <div class="chart-plot h340" id="chart-heatmap"></div>
    </div>`;

  // Radar
  if (clusters) {
    const radarLabels = ['活跃度(R↓)', '频次(F)', '消费(M)', '点击量', '订单率'];
    const metricCols = ['avg_F', 'avg_M', 'avg_clicks', 'order_rate'];
    const maxVals = metricCols.map(col => Math.max(...clusters.map(c => Math.abs(c[col]||0)), 0.01));
    const rVals = clusters.map(c => Number(c.avg_R || 0));
    const rMin = Math.min(...rVals), rMax = Math.max(...rVals);
    const normalizeRecency = c => rMax > rMin ? (rMax - Number(c.avg_R || 0)) / (rMax - rMin) : 0;
    draw('chart-radar', clusters.map((c, i) => ({
      type: 'scatterpolar',
      r: [
        normalizeRecency(c),
        ...metricCols.map((col, j) => (c[col]||0) / maxVals[j]),
        normalizeRecency(c),
      ],
      theta: [...radarLabels, radarLabels[0]],
      name: `Cluster ${c.cluster} ${c.role}`,
      fill: 'toself', line: { color: c.color, width: 2 },
      fillcolor: `${c.color}18`,
    })), {
      polar: {
        radialaxis: { visible: true, range: [0, 1.05], gridcolor: '#e8e3da', color: '#5c5852' },
        angularaxis: { gridcolor: '#e8e3da', color: '#5c5852' },
        bgcolor: 'rgba(0,0,0,0)',
      },
      margin: { l: 30, r: 30, t: 30, b: 30 },
      showlegend: true, legend: { y: -0.05 },
    });

    // Cluster table
    document.getElementById('chart-cluster-table').innerHTML = `<table class="data-table"><thead><tr><th>群组</th><th>角色</th><th>用户数</th><th>均R(天)</th><th>均F</th><th>均M(¥)</th><th>均点击</th><th>订单率</th></tr></thead>
      <tbody>${clusters.map(c=>`<tr><td style="color:${c.color};font-weight:500;">Cluster ${c.cluster}</td><td>${c.role}</td><td>${c.user_count.toLocaleString()}</td><td>${c.avg_R.toFixed(0)}</td><td>${c.avg_F.toFixed(1)}</td><td>${formatNumber(c.avg_M, c.avg_M < 1 && c.avg_M > 0 ? 2 : 0)}</td><td>${c.avg_clicks.toFixed(0)}</td><td>${(c.order_rate*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`;
  }

  // Heatmap — normalize per-cluster category distribution
  if (clusterCat) {
    const catCounts = {};
    clusterCat.forEach(d => { catCounts[d.cid1_name] = (catCounts[d.cid1_name]||0) + d.count; });
    const topCats = Object.entries(catCounts).sort((a,b) => b[1]-a[1]).slice(0, 12).map(e => e[0]);
    const filtered = clusterCat.filter(d => topCats.includes(d.cid1_name));
    const clusterIds = [...new Set(filtered.map(d => d.cluster))].sort((a,b) => a-b);
    const pivot = {};
    const totals = {};
    clusterIds.forEach(c => { pivot[c] = {}; totals[c] = 0; topCats.forEach(cat => { pivot[c][cat] = 0; }); });
    filtered.forEach(d => { pivot[d.cluster][d.cid1_name] += d.count; totals[d.cluster] += d.count; });
    const zData = clusterIds.map(c => topCats.map(cat => {
      return totals[c] > 0 ? pivot[c][cat] / totals[c] : 0;
    }));
    draw('chart-heatmap', [{
      type: 'heatmap',
      z: zData,
      x: topCats,
      y: clusterIds.map(c => `Cluster ${c}`),
      colorscale: [
        [0, '#faf8f5'], [0.15, '#f0ece5'], [0.35, GOLD_LIGHT],
        [0.55, GOLD], [0.75, BRONZE], [1, CRIMSON],
      ],
      text: zData.map(row => row.map(v => (v*100).toFixed(1)+'%')),
      texttemplate: '%{text}',
      textfont: { color: '#1a1815', size: 10 },
      hovertemplate: '群组: %{y}<br>品类: %{x}<br>占比: %{z:.1%}<extra></extra>',
      hoverongaps: false,
    }], {
      margin: { l: 80, r: 30, t: 30, b: 100 },
      xaxis: { tickangle: -30, automargin: true },
      yaxis: { automargin: true },
      hoverlabel: { bgcolor: '#ffffff', bordercolor: '#d9d3c7', font: { color: '#1a1815', size: 12 } },
    });
  }
}

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  MODULE 5: 热销商品分析                                                      ║
// ╚══════════════════════════════════════════════════════════════════════════════╝

async function renderProducts(main) {
  let [topItems, topCats, topBrands, priceDist] = await Promise.all([
    fetchAPI('/products/top?limit=30'), fetchAPI('/products/top-categories'),
    fetchAPI('/products/top-brands'), fetchAPI('/products/price-distribution'),
  ]);

  // Filter out items with missing product info (de-listed products)
  if (topItems) topItems = topItems.filter(d => d.item_name && d.cid1_name);

  // Compute category average price from top items
  const catPrices = {};
  const catCounts = {};
  if (topItems) topItems.forEach(d => {
    if (!d.cid1_name) return;
    catPrices[d.cid1_name] = (catPrices[d.cid1_name] || 0) + (d.price || 0);
    catCounts[d.cid1_name] = (catCounts[d.cid1_name] || 0) + 1;
  });
  const catAvgPrice = Object.entries(catPrices)
    .map(([name, total]) => ({ category: name, avg_price: +(total / catCounts[name]).toFixed(0) }))
    .sort((a, b) => b.avg_price - a.avg_price);

  main.innerHTML = `
    <div class="page-header">
      <div class="section-label">Module 05</div>
      <h1 class="display-title">热销商品<em>分析</em></h1>
    </div>
    <div class="chart-row">
      <div class="chart-panel animate-in stagger-1"><div class="chart-title">品类销售分布</div><div class="chart-subtitle">各一级品类订单量占比</div><div class="chart-plot h400" id="chart-treemap"></div></div>
      <div class="chart-panel animate-in stagger-2"><div class="chart-title">购买商品价位分布</div><div class="chart-subtitle">订单中商品单价区间统计</div><div class="chart-plot h400" id="chart-price"></div></div>
    </div>
    <div class="chart-row">
      <div class="chart-panel animate-in stagger-3"><div class="chart-title">价格×销量关系</div><div class="chart-subtitle">气泡大小 = 销售件数 · 颜色 = 品类 · Top 30 热销商品</div><div class="chart-plot h400" id="chart-bubble"></div></div>
      <div class="chart-panel animate-in stagger-4"><div class="chart-title">热销品类均价对比</div><div class="chart-subtitle">Top 热销商品在各品类的平均单价</div><div class="chart-plot h400" id="chart-catprice"></div></div>
    </div>
    <div class="chart-panel animate-in stagger-5">
      <div class="chart-title">热销商品明细表</div>
      <div class="chart-subtitle">Top 30 按订单量降序 · 含商品名称、品类、品牌、价格、销量</div>
      <div id="productTable" style="max-height:500px;overflow-y:auto;"></div>
    </div>`;

  // Treemap (keep)
  if (topCats) draw('chart-treemap', [{
    type: 'treemap',
    labels: topCats.map(d => d.cid1_name),
    values: topCats.map(d => d.count),
    parents: topCats.map(() => ''),
    marker: { colors: topCats.map(d => d.count), colorscale: [[0,'#faf8f5'],[0.3,BRONZE],[0.6,GOLD],[1,CRIMSON]] },
    textfont: { color: '#1a1815', size: 12, family: FONT_FAMILY },
    textinfo: 'label+value',
  }], { margin: { l: 10, r: 10, t: 30, b: 10 } });

  // Price distribution (keep)
  if (priceDist) draw('chart-price', [{
    type: 'bar', x: priceDist.map(d => d.bin), y: priceDist.map(d => d.count),
    marker: { color: GOLD, line: { width: 0 } },
    text: priceDist.map(d => d.count.toLocaleString()), textposition: 'outside',
    textfont: { color: '#5c5852', size: 10 },
  }], { margin: { b: 80 } });

  // Price × Orders bubble chart (replaces Top 15)
  if (topItems) {
    // Assign colors per category
    const cats = [...new Set(topItems.map(d => d.cid1_name || '其他'))];
    const catColorMap = {};
    cats.forEach((c, i) => { catColorMap[c] = CHART_COLORS[i % CHART_COLORS.length]; });

    draw('chart-bubble', [{
      type: 'scatter', mode: 'markers',
      x: topItems.map(d => d.price || 0),
      y: topItems.map(d => d.order_count),
      marker: {
        size: topItems.map(d => Math.max(8, Math.sqrt((d.total_qty || 1)) * 1.8)),
        color: topItems.map(d => catColorMap[d.cid1_name || '其他']),
        line: { width: 1, color: 'rgba(0,0,0,0.1)' },
        sizemode: 'area',
      },
      text: topItems.map(d => `${(d.item_name||d.item_id).substring(0,30)}<br>品类: ${d.cid1_name||''}<br>单价: ¥${(d.price||0).toFixed(0)}<br>订单: ${d.order_count}<br>销量: ${d.total_qty}件`),
      hoverinfo: 'text',
    }], {
      xaxis: { title: { text: '单价 (¥)', font: { size: 11 } }, gridcolor: '#e8e3da', zeroline: true },
      yaxis: { title: { text: '订单数', font: { size: 11 } }, gridcolor: '#e8e3da', zeroline: true },
      margin: { l: 60, r: 20, t: 20, b: 60 },
      showlegend: false,
      hovermode: 'closest',
    });
  }

  // Category average price (replaces Top 20 brands)
  if (catAvgPrice.length) draw('chart-catprice', [{
    type: 'bar', orientation: 'h',
    y: catAvgPrice.map(d => d.category),
    x: catAvgPrice.map(d => d.avg_price),
    marker: {
      color: catAvgPrice.map(d => d.avg_price),
      colorscale: [[0, STEEL], [0.5, GOLD], [1, CRIMSON]],
      line: { width: 0 },
    },
    text: catAvgPrice.map(d => `¥${d.avg_price}`), textposition: 'outside',
    textfont: { color: '#5c5852', size: 10 },
  }], {
    height: 400,
    margin: { l: 120, r: 60, t: 20, b: 30 },
    xaxis: { title: { text: '均价 (¥)', font: { size: 10 } }, gridcolor: '#e8e3da' },
    yaxis: { automargin: true },
  });

  // Product data table (always visible, no toggle needed)
  if (topItems) {
    document.getElementById('productTable').innerHTML = `<table class="data-table"><thead><tr>
      <th>#</th><th>商品名称</th><th>一级类目</th><th>三级类目</th><th>品牌码</th><th>单价</th><th>订单数</th><th>销售件数</th><th>销售额</th>
    </tr></thead><tbody>${topItems.map((d, i) => `<tr>
      <td style="color:var(--text-muted);">${i+1}</td>
      <td style="color:var(--text-primary);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${d.item_name||''}">${(d.item_name||d.item_id).substring(0,35)}</td>
      <td>${d.cid1_name||''}</td>
      <td>${d.cid3_name||''}</td>
      <td>${d.brand_code||''}</td>
      <td style="color:var(--accent-gold);">¥${(d.price||0).toFixed(0)}</td>
      <td>${d.order_count}</td>
      <td>${d.total_qty}</td>
      <td>¥${((d.price||0)*d.total_qty).toLocaleString()}</td>
    </tr>`).join('')}</tbody></table>`;
  }
}

// ── User Search ────────────────────────────────────────────────────────────

let searchTimeout;
document.getElementById('userSearch').addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const query = document.getElementById('userSearch').value.trim();
  if (!query) { document.getElementById('searchResult').classList.remove('visible'); return; }
  searchTimeout = setTimeout(async () => {
    const data = await fetchAPI(`/user/${query}`);
    const result = document.getElementById('searchResult');
    if (!data) { result.innerHTML = '<div style="color:var(--accent-crimson);">用户不存在</div>'; result.classList.add('visible'); return; }
    const prob = data.prediction ? (data.prediction.probability*100).toFixed(1)+'%' : 'N/A';
    result.innerHTML = `
      <div class="sr-name">用户 ${data.user_id}</div>
      <div class="sr-stat">${data.gender} · ${data.age_range} · Cluster ${data.cluster}</div>
      <div class="sr-stat">R: ${data.R_days}天 · F: ${data.F_count}次 · M: ¥${data.total_order_amount.toLocaleString()}</div>
      <div class="sr-stat" style="color:var(--accent-gold);margin-top:0.15rem;">购买倾向: ${prob} (${data.prediction?.segment||'未知'})</div>`;
    result.classList.add('visible');
  }, 300);
});

// ── Init ───────────────────────────────────────────────────────────────────
renderPage('overview');
</script>
